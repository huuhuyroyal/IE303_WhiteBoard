# Development Profile - application-dev.properties
# Auto-reload, verbose logging, local database

# Hibernate configuration for development
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.root=INFO
logging.level.com.example.backend_Whiteboard=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# DevTools (hot reload)
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# CORS - allow localhost
server.servlet.session.cookie.http-only=false
server.servlet.session.cookie.secure=false

# Database default for local dev (if not set via .env)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/whiteboard}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
